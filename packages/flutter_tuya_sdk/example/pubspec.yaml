name: flutter_tuya_sdk_example
description: Minimal example demonstrating flutter_tuya_sdk — auth, home/device, BLE/WiFi pairing and lock control.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.2
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tuya_sdk:
    path: ../
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.2.5
  bloc: ^9.1.0
  lucide_icons_flutter: ^3.1.4
  lucide_icons: any
  loader_overlay: ^5.0.0
  permission_handler: ^12.0.1
  flutter_blue_plus: ^2.0.1
  device_info_plus: ^12.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
